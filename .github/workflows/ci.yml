name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly CodeQL re-scan, Mondays 03:17 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c:
    name: C — build (warnings as errors) + tests under ASan/UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with sanitizers
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -O1 -g \
              -fsanitize=address,undefined -fno-omit-frame-pointer \
              -o graph_traversals c/graph_lab/graph_traversals.c
      - name: Run tests
        run: c/graph_lab/tests/run_tests.sh ./graph_traversals
      - name: Build array lab (exercise must compile; solution must pass)
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -O1 -g \
              -fsanitize=address,undefined -fno-omit-frame-pointer \
              -o array_ops_exercise c/array_lab/array_ops.c
          gcc -std=c11 -Wall -Wextra -Werror -O1 -g \
              -fsanitize=address,undefined -fno-omit-frame-pointer \
              -o array_ops c/array_lab/solution/array_ops.c
      - name: Run array lab tests
        run: c/array_lab/tests/run_tests.sh ./array_ops

  array_basics:
    name: Array basics — C, Java, Python, Rust must print identical output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build all four (warnings as errors), compare output, run Rust unit tests
        run: shared/array_basics/run_all.sh

  linked_list:
    name: Linked list — C, Java, Python, Rust must print identical output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build all four, compare output, ASan leak check, Rust unit tests
        run: shared/linked_list/run_all.sh

  doubly_linked_list:
    name: Doubly linked list — C, Java, Python, Rust must print identical output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build all four, compare output, ASan leak check, Rust unit tests
        run: shared/doubly_linked_list/run_all.sh

  docker:
    name: Docker — image builds and runs both lab suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t polyglot-lab .
      - name: Run both lab suites inside the container
        run: |
          docker run --rm polyglot-lab shared/array_basics/run_all.sh
          docker run --rm polyglot-lab shared/linked_list/run_all.sh

  python:
    name: Python — lint + compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check python/ tools/
      - run: ruff format --check python/ tools/
      - run: python -m compileall -q python/ tools/

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --verbose

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - if: matrix.build-mode == 'manual'
        run: |
          gcc -std=c11 -o /tmp/graph_traversals c/graph_lab/graph_traversals.c
          gcc -std=c11 -o /tmp/array_ops c/array_lab/solution/array_ops.c
          gcc -std=c11 -o /tmp/array_basics c/array_basics/array_basics.c
          gcc -std=c11 -o /tmp/linked_list c/linked_list/linked_list.c
          gcc -std=c11 -o /tmp/doubly_linked_list c/doubly_linked_list/doubly_linked_list.c
      - uses: github/codeql-action/analyze@v3
