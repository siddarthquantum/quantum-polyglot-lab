name: Containers + report

# Builds the four doubly-linked-list containers, verifies output, checksums and
# isolation, renders the report page, and (on main only) publishes it to
# GitHub Pages. On pull requests the page is attached as a build artifact.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    name: Four isolated containers — build, verify, measure, render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, run and inspect the C, Java, Python and Rust containers
        run: python3 tools/report/collect.py --out report-data/results.json
      # Render even when a gate failed, so the page shows what broke.
      - name: Render report
        if: always() && hashFiles('report-data/results.json') != ''
        run: python3 tools/report/build_report.py report-data/results.json --out site
      - name: Attach report (download from the run's Summary page)
        if: always() && hashFiles('site/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: site
      - name: Package report for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    name: Publish report to GitHub Pages
    needs: containers
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
