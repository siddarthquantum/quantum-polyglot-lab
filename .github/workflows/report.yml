name: Containers + report

# Builds the four doubly-linked-list containers, verifies output, checksums and
# isolation, renders the report page, then serves it from the local nginx
# container exactly as tools/report/local.sh does, and fetches it over
# localhost. Nothing is published; the page is attached to the run as an
# artifact.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    name: Four isolated containers — build, verify, measure, render, serve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, run and inspect the C, Java, Python and Rust containers
        run: python3 tools/report/collect.py --out report-data/results.json
      # Render even when a gate failed, so the page shows what broke.
      - name: Render report
        if: always() && hashFiles('report-data/results.json') != ''
        run: python3 tools/report/build_report.py report-data/results.json --out site
      - name: Serve on localhost from the hardened nginx container and fetch it
        run: |
          compose="docker compose -f docker/doubly_linked_list/compose.yaml --profile report"
          $compose up -d report
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/ -o page.html && break
            sleep 1
          done
          grep -q "<title>Polyglot Lab Report</title>" page.html
          curl -fsS http://127.0.0.1:8080/results.json | python3 -c "import json, sys; json.load(sys.stdin)"
          id=$($compose ps -q report)
          docker inspect "$id" --format 'user={{.Config.User}} read_only={{.HostConfig.ReadonlyRootfs}} caps={{.HostConfig.CapDrop}}' | tee inspect.txt
          grep -q "read_only=true" inspect.txt
          grep -q "caps=\[ALL\]" inspect.txt
          $compose logs report
          $compose down
      - name: Attach report (download from the run's Summary page)
        if: always() && hashFiles('site/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: site
